name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Validate pull request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          node -e 'const title = process.env.PR_TITLE; const valid = /^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9][a-z0-9._/-]*\))?!?: .+$/u.test(title); if (!valid) { console.error("Invalid Conventional Commit title: " + title); process.exit(1); }'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        if: github.event_name == 'pull_request'
        with:
          fail-on-severity: high

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - run: bun install --frozen-lockfile

      - run: bun run check

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Use the pinned npm CLI
        run: |
          echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"
          test "$(./node_modules/.bin/npm --version)" = "12.2.3"

      - name: Create and inspect the package tarball
        id: pack
        env:
          TARBALL_DIR: ${{ runner.temp }}
        run: |
          npm pack --pack-destination "$TARBALL_DIR" --json > "$TARBALL_DIR/pack.json"
          TARBALL="$(node -e 'const path = require("node:path"); const output = require(process.argv[1]); const pack = Array.isArray(output) ? output[0] : Object.values(output)[0]; process.stdout.write(path.join(process.env.TARBALL_DIR, pack.filename));' "$TARBALL_DIR/pack.json")"
          echo "path=$TARBALL" >> "$GITHUB_OUTPUT"
      - name: Install and verify the exact tarball in an isolated consumer
        env:
          TARBALL: ${{ steps.pack.outputs.path }}
          CONSUMER_DIR: ${{ runner.temp }}/consumer
        run: scripts/consumer-smoke.sh "$TARBALL"

      - name: Verify the tarball with the latest supported Payload 3.x
        env:
          TARBALL: ${{ steps.pack.outputs.path }}
          PAYLOAD_VERSION: 3.94.2
        run: scripts/consumer-smoke.sh "$TARBALL"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.5
          package-manager-cache: false

      - name: Test the tarball on the minimum supported Node.js 22
        working-directory: ${{ runner.temp }}/consumer
        run: node runtime-smoke.mjs

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.3
          package-manager-cache: false

      - name: Test the tarball on the minimum supported Node.js 24
        working-directory: ${{ runner.temp }}/consumer
        run: node runtime-smoke.mjs

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
          package-manager-cache: false

      - name: Test the tarball on the minimum supported Node.js 26
        working-directory: ${{ runner.temp }}/consumer
        run: node runtime-smoke.mjs

  security:
    name: security
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - run: bun install --frozen-lockfile

      - run: bun audit --audit-level=high

      - uses: zizmorcore/zizmor-action@bd12b495c90993a4301c73398142281a61499af3 # v0.9.0
